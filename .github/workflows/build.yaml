name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_vcpkg:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11.5
        with:
          vcpkgGitCommitId: 7f9f0e44db287e8e67c0e888141bfa200ab45121
      - name: Cache vcpkg
        uses: actions/cache@v4.2.1
        with:
          path: |
            vcpkg_installed
            build
          key: |
            vcpkg-windows-x64-${{ runner.os }}-${{ hashFiles('**/vcpkg.json') }}

      - name: Install
        run: cd ./crates/commonlibsse_ng_sys && vcpkg install

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2.7.7
        with:
          prefix-key: cargo-debug-x86_64-pc-windows-msvc--vcpkg
      - name: Build
        run: cargo build -p commonlibsse_ng_sys --features vcpkg --no-default-features

      # - name: Upload a Build Artifact
      #   uses: actions/upload-artifact@v4.6.1
      #   with:
      #     name: CommonLibSSE-NG
      #     path: |
      #       ./vcpkg_installed/x64-windows/include
      #       ./vcpkg_installed/x64-windows/lib
      #       !./vcpkg_installed/x64-windows/lib/CommonLibSSE-NG/
      #       ./vcpkg_installed/x64-windows/share

  prebuilt:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Change package dir
        run: cd ./crates/commonlibsse_ng_sys

      - name: Cache vcpkg
        uses: actions/cache@v4.2.1
        with:
          path: |
            vcpkg_installed
            build
          key: |
            vcpkg-windows-x64-${{ runner.os }}-${{ hashFiles('**/vcpkg.json') }}

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2.7.7
        with:
          prefix-key: cargo-debug-x86_64-pc-windows-msvc--prebuilt
      - name: Build
        run: cargo build -p commonlibsse_ng_sys
